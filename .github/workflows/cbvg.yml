name: CBVG security regression
on:
  pull_request:
    paths:
      - 'cbvg.py'
      - 'cbvg_paired.py'
      - 'tests/test_cbvg*.py'
      - '.github/workflows/cbvg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cbvg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CBVG focused tests
        run: python -m unittest discover -s tests -p 'test_cbvg*.py' -v
