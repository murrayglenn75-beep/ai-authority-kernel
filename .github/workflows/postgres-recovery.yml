name: PostgreSQL recovery model
on:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: recovery-only-test
          POSTGRES_DB: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AAK_RECOVERY_TEST_DSN: postgresql://postgres:recovery-only-test@127.0.0.1:5432/recovery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Check Python syntax
        run: python -m py_compile tests/postgres_recovery_harness.py
      - name: Run PostgreSQL multi-process recovery tests
        run: python -W error::ResourceWarning tests/postgres_recovery_harness.py
