name: agent-runtime-defensive-checks
on:
  push:
    branches: [feat/agent-runtime-reliability]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aaktest
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: aaktest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaktest -d aaktest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AAK_TEST_POSTGRES_DSN: postgresql://aaktest:local_ci_only@localhost:5432/aaktest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependency
        run: python -m pip install -r requirements-runtime.lock "psycopg[binary]>=3.2,<4"
      - name: Test shared PostgreSQL lease and dispatch fencing
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_postgres_fencing.py -q
  defensive-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.lock
      - name: Run standalone agent-runtime checks
        run: PYTHONPATH=. python verify_agent_runtime.py benchmark_agent_reliability.py
      - name: Run signed AAK integration scenario
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_runtime_integration.py -q
      - name: Run durable journal concurrency checks
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_runtime_journal_concurrency.py -q
      - name: Run broker boundary tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_broker_fence_integration.py -q
      - name: Run worker fencing tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_worker_fencing.py -q
      - name: Run synthetic reliability matrix
        run: PYTHONPATH=. python benchmark_agent_reliability.py
      - name: Check syntax
        run: python -m compileall -q aak/agent_runtime.py aak/runtime_store.py aak/reliability_contract.py verify_agent_runtime.py
